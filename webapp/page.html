<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Live</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0b1220; --panel:#111a2e; --edge:#1f2c47; --txt:#e6edf7; --mut:#7f8da8;
          --up:#22c55e; --dn:#ef4444; --amb:#f59e0b; --blu:#3b82f6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.35 -apple-system,system-ui,Segoe UI,Roboto,sans-serif; }
  body { padding:env(safe-area-inset-top,0) 10px env(safe-area-inset-bottom,0); max-width:720px; margin:0 auto; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .head { padding:12px 2px 6px; }
  .sym { font-size:20px; font-weight:700; letter-spacing:.2px; }
  .badge { padding:3px 9px; border-radius:999px; font-weight:700; font-size:12px; }
  .long { background:rgba(34,197,94,.16); color:var(--up); } .short { background:rgba(239,68,68,.16); color:var(--dn); }
  .price { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }
  .pnl { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .dn { color:var(--dn); } .mut { color:var(--mut); }
  .status { margin:8px 0; padding:9px 12px; border-radius:12px; background:var(--panel); border:1px solid var(--edge); font-weight:600; }
  .status.ok { border-color:rgba(34,197,94,.5); } .status.bad { border-color:rgba(239,68,68,.5); }
  .chartbox { position:relative; background:var(--panel); border:1px solid var(--edge); border-radius:14px; overflow:hidden; }
  canvas { display:block; width:100%; height:52vh; min-height:300px; touch-action:none; }
  .tools { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .btn { flex:1; min-width:52px; text-align:center; padding:8px 6px; border-radius:10px; background:var(--panel);
         border:1px solid var(--edge); color:var(--mut); font-weight:600; user-select:none; }
  .btn.on { color:var(--txt); border-color:var(--blu); background:rgba(59,130,246,.14); }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--edge); border-radius:12px; overflow:hidden; }
  td { padding:8px 10px; border-bottom:1px solid var(--edge); font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:0; } td:last-child { text-align:right; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; }
  #err { display:none; margin:10px 0; padding:10px 12px; border-radius:12px; background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.5); }
  .live { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--up); margin-right:6px; animation:p 1.4s infinite; }
  @keyframes p { 0%{opacity:1} 50%{opacity:.25} 100%{opacity:1} }
  .foot { text-align:center; color:var(--mut); font-size:11px; padding:10px 0 16px; }
</style>
</head>
<body>
<div class="head">
  <div class="row"><div class="sym" id="sym">…</div><span class="badge" id="side"></span></div>
  <div class="row" style="margin-top:4px">
    <div class="price" id="price">—</div>
    <div style="text-align:right"><div class="pnl" id="pnlR">—</div><div class="mut" id="pnlP"></div></div>
  </div>
</div>
<div id="err"></div>
<div class="status" id="status">Загрузка…</div>
<div class="chartbox"><canvas id="cv"></canvas></div>
<div class="tools" id="tfs">
  <div class="btn" data-iv="1">1м</div><div class="btn" data-iv="5">5м</div><div class="btn" data-iv="15">15м</div>
  <div class="btn" data-iv="60">1ч</div>
  <div class="btn" id="allbtn">Все цели</div>
</div>
<table id="levels"></table>
<div class="foot"><span class="live"></span><span id="upd">обновление каждые 3 с</span></div>

<script>
"use strict";
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#0b1220"); tg.setBackgroundColor && tg.setBackgroundColor("#0b1220"); } catch (e) {} }
var qs = new URLSearchParams(location.search);
var SYMBOL = (qs.get("s") || "").toUpperCase(), SENT = parseInt(qs.get("t") || "0", 10);
var S = { sig: null, interval: null, count: 90, all: false, c1: [], cv: [], lastOk: 0 };

var COL = { up:"#22c55e", dn:"#ef4444", amb:"#f59e0b", blu:"#3b82f6", grid:"#1b2742", mut:"#7f8da8", txt:"#e6edf7" };

function $(id) { return document.getElementById(id); }
function fmt(x) { if (x === null || x === undefined || isNaN(x)) return "—"; return String(parseFloat(Number(x).toPrecision(6))); }
function pct(a, b) { return ((a - b) / b * 100); }
function showErr(m) { var e = $("err"); if (!m) { e.style.display = "none"; return; } e.textContent = "⚠️ " + m; e.style.display = "block"; }

function api(path) {
  return fetch(path, { headers: { "X-Init-Data": tg ? tg.initData : "" }, cache: "no-store" }).then(function (r) {
    return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; });
  });
}

/* ---------- jonli kuzatuv: sim.py bilan bir xil qoidalar (1m shamlar bo'yicha, oraliq natija) ---------- */
function trackLive(sig, candles) {
  var long = sig.side === "LONG", three = sig.tp3 !== null && sig.tp3 !== undefined;
  var stage = 0, final = null, risk = Math.abs(sig.entry - sig.sl) || 1;
  var rr1 = Math.abs(sig.tp1 - sig.entry) / risk, rr2 = Math.abs(sig.tp2 - sig.entry) / risk;
  var start = (Math.floor(sig.sent_ts / 60) + 1) * 60000;           // signal kelgan minutdan KEYINGI sham
  for (var i = 0; i < candles.length; i++) {
    var c = candles[i]; if (c[0] < start) continue;
    var hi = c[2], lo = c[3];
    var stop = stage === 0 ? sig.sl : (stage === 1 ? sig.entry : sig.tp1);
    if (long ? lo <= stop : hi >= stop) {
      if (stage === 0) final = "sl"; else if (stage === 1) final = "be"; else final = three ? "lock" : "be";
      break;
    }
    if (stage === 0 && (long ? hi >= sig.tp1 : lo <= sig.tp1)) stage = 1;
    if (stage === 1 && (long ? hi >= sig.tp2 : lo <= sig.tp2)) {
      if (three) stage = 2; else { stage = 2; final = "tp2"; break; }
    }
    if (three && stage === 2 && (long ? hi >= sig.tp3 : lo <= sig.tp3)) { stage = 3; final = "tp3"; break; }
  }
  return { stage: stage, final: final };
}

var FINAL_TXT = {
  sl: ["❌ Сработал SL", "bad"], be: ["✅ TP1 взят, остаток закрыт в безубытке", "ok"],
  tp2: ["✅✅ TP2 достигнут", "ok"], tp3: ["🏆 TP3 достигнут", "ok"],
  lock: ["✅✅ TP1+TP2 взяты, остаток закрыт по TP1", "ok"], expired: ["⏱ Срок сигнала истёк", ""]
};

function currentState() {
  var sig = S.sig; if (!sig) return { text: "Загрузка…", cls: "", stage: 0, final: null };
  if (sig.status && sig.status !== "open") {                          // серверный итог — авторитетный
    var t = FINAL_TXT[sig.status] || [sig.status, ""];
    var r = (sig.result_r !== null && sig.result_r !== undefined) ? " · " + (sig.result_r >= 0 ? "+" : "") + Number(sig.result_r).toFixed(2) + "R" : "";
    return { text: t[0] + r, cls: t[1], stage: sig.stage, final: sig.status };
  }
  var lv = S.c1.length ? trackLive(sig, S.c1) : { stage: sig.stage, final: null };
  var stage = Math.max(lv.stage, sig.stage), three = sig.tp3 !== null && sig.tp3 !== undefined;
  if (lv.final) { var t2 = FINAL_TXT[lv.final]; return { text: t2[0] + " (по свечам 1м, предварительно)", cls: t2[1], stage: stage, final: lv.final }; }
  if (stage === 0) return { text: "🟢 Открыт · ждём TP1", cls: "", stage: 0, final: null };
  if (stage === 1) return { text: "🎯 TP1 взят · SL → вход (безубыток)", cls: "ok", stage: 1, final: null };
  return { text: three ? "🎯🎯 TP2 взят · SL → TP1 · цель TP3" : "🎯🎯 TP2 взят", cls: "ok", stage: 2, final: null };
}

/* ---------- chizish ---------- */
function levelsList() {
  var s = S.sig; if (!s) return [];
  var out = [{ k: "SL", v: s.sl, c: COL.dn }, { k: "Вход", v: s.entry, c: COL.amb }, { k: "TP1", v: s.tp1, c: COL.up }, { k: "TP2", v: s.tp2, c: COL.up }];
  if (s.tp3 !== null && s.tp3 !== undefined) out.push({ k: "TP3", v: s.tp3, c: "#34d399" });
  return out;
}

function draw() {
  var cv = $("cv"), dpr = window.devicePixelRatio || 1;
  var W = cv.clientWidth, H = cv.clientHeight; if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  var g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  var all = S.cv.length ? S.cv : S.c1;
  var cs = all.slice(-S.count);
  if (!cs.length) { g.fillStyle = COL.mut; g.font = "14px sans-serif"; g.fillText("Нет данных…", 14, 28); return; }
  var L = levelsList(), s = S.sig;
  var lo = Infinity, hi = -Infinity, i;
  for (i = 0; i < cs.length; i++) { lo = Math.min(lo, cs[i][3]); hi = Math.max(hi, cs[i][2]); }
  var base = [lo, hi];
  if (s) { base.push(s.entry, s.sl, s.tp1); if (S.all) { base.push(s.tp2); if (s.tp3) base.push(s.tp3); } }
  lo = Math.min.apply(null, base); hi = Math.max.apply(null, base);
  var pad = (hi - lo) * 0.06 || hi * 0.01; lo -= pad; hi += pad;
  var PR = 62, PT = 8, PB = 8, cw = W - PR, ch = H - PT - PB;
  function Y(p) { return PT + (hi - p) / (hi - lo) * ch; }
  g.font = "10.5px -apple-system,system-ui,sans-serif"; g.textBaseline = "middle";
  // setka
  g.strokeStyle = COL.grid; g.lineWidth = 1; g.fillStyle = COL.mut;
  for (i = 0; i <= 5; i++) { var p = lo + (hi - lo) * i / 5, y = Y(p); g.beginPath(); g.moveTo(0, y); g.lineTo(cw, y); g.stroke(); g.fillText(fmt(p), cw + 5, y); }
  // shamlar
  var n = cs.length, step = cw / (n + 3), bw = Math.max(1.5, step * 0.62);
  for (i = 0; i < n; i++) {
    var c = cs[i], x = step * (i + 0.5), up = c[4] >= c[1], col = up ? COL.up : COL.dn;
    g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, Y(c[2])); g.lineTo(x, Y(c[3])); g.stroke();
    var yo = Y(c[1]), yc = Y(c[4]); g.fillRect(x - bw / 2, Math.min(yo, yc), bw, Math.max(1, Math.abs(yo - yc)));
  }
  // signal vaqti
  if (s) {
    var sm = s.sent_ts * 1000, idx = -1;
    for (i = 0; i < n; i++) if (cs[i][0] <= sm) idx = i;
    if (idx >= 0) {
      var xs = step * (idx + 0.5); g.setLineDash([4, 4]); g.strokeStyle = COL.blu; g.beginPath(); g.moveTo(xs, PT); g.lineTo(xs, H - PB); g.stroke(); g.setLineDash([]);
      g.fillStyle = COL.blu; g.fillText("сигнал", Math.min(xs + 4, cw - 40), PT + 8);
    }
  }
  // darajalar (diapazondan chiqqanlari chetda ▲/▼ bilan)
  var st = currentState(), offTop = 0, offBot = 0;
  for (i = 0; i < L.length; i++) {
    var lv = L[i], inR = lv.v >= lo && lv.v <= hi;
    var reached = (lv.k === "TP1" && st.stage >= 1) || (lv.k === "TP2" && st.stage >= 2) || (lv.k === "TP3" && st.stage >= 3);
    if (!inR) {                       // diapazondan tashqari daraja: chiziqsiz, o'ng chetda belgi (chartni siqmaslik uchun)
      var up = lv.v > hi, lab2 = (up ? "▲ " : "▼ ") + lv.k + (reached ? " ✓" : "") + "  " + fmt(lv.v);
      var w2 = g.measureText(lab2).width + 10, y2 = up ? PT + 12 + offTop++ * 18 : H - PB - 12 - offBot++ * 18;
      g.globalAlpha = 0.2; g.fillStyle = lv.c; g.fillRect(cw - w2 - 4, y2 - 9, w2, 17); g.globalAlpha = 1;
      g.fillStyle = lv.c; g.fillText(lab2, cw - w2 + 1, y2);
      continue;
    }
    var yy = Y(lv.v);
    g.strokeStyle = lv.c; g.lineWidth = 1.2; g.globalAlpha = reached ? 0.45 : 0.95; g.setLineDash([6, 4]);
    g.beginPath(); g.moveTo(0, yy); g.lineTo(cw, yy); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
    var lab = lv.k + (reached ? " ✓" : "");
    var tw = g.measureText(lab).width + 8; g.fillStyle = lv.c; g.globalAlpha = 0.18; g.fillRect(4, yy - 17, tw, 15); g.globalAlpha = 1;
    g.fillStyle = lv.c; g.fillText(lab, 8, yy - 9.5);
  }
  // joriy narx
  var last = (S.c1.length ? S.c1[S.c1.length - 1][4] : cs[cs.length - 1][4]), yl = Y(Math.min(Math.max(last, lo), hi));
  var r = pnlR(last), col2 = (r === null || r >= 0) ? COL.up : COL.dn;
  g.strokeStyle = col2; g.lineWidth = 1; g.setLineDash([2, 3]); g.beginPath(); g.moveTo(0, yl); g.lineTo(cw, yl); g.stroke(); g.setLineDash([]);
  g.fillStyle = col2; g.fillRect(cw + 1, yl - 9, PR - 2, 18); g.fillStyle = "#0b1220"; g.font = "bold 10.5px -apple-system,system-ui,sans-serif"; g.fillText(fmt(last), cw + 5, yl);
}

function pnlR(price) {
  var s = S.sig; if (!s) return null;
  var risk = Math.abs(s.entry - s.sl); if (!risk) return null;
  return (s.side === "LONG" ? price - s.entry : s.entry - price) / risk;
}

function render() {
  var s = S.sig, last = S.c1.length ? S.c1[S.c1.length - 1][4] : null;
  if (s) {
    $("sym").textContent = s.symbol.replace("USDT", "") + " / USDT";
    var b = $("side"); b.textContent = s.side; b.className = "badge " + (s.side === "LONG" ? "long" : "short");
  } else { $("sym").textContent = SYMBOL ? SYMBOL.replace("USDT", "") + " / USDT" : "—"; }
  if (last !== null) {
    $("price").textContent = fmt(last);
    if (s) {
      var r = pnlR(last), pc = (s.side === "LONG" ? 1 : -1) * pct(last, s.entry);
      $("pnlR").textContent = (r >= 0 ? "+" : "") + r.toFixed(2) + " R"; $("pnlR").className = "pnl " + (r >= 0 ? "up" : "dn");
      $("pnlP").textContent = (pc >= 0 ? "+" : "") + pc.toFixed(2) + "% от входа"; 
    }
  }
  var st = currentState(), el = $("status"); el.textContent = st.text; el.className = "status " + st.cls;
  if (s) {
    var rows = levelsList().slice().sort(function (a, b) { return s.side === "LONG" ? b.v - a.v : a.v - b.v; }), h = "";
    for (var i = 0; i < rows.length; i++) {
      var lv = rows[i], d = last !== null ? pct(lv.v, last) : null;
      var reached = (lv.k === "TP1" && st.stage >= 1) || (lv.k === "TP2" && st.stage >= 2) || (lv.k === "TP3" && st.stage >= 3);
      h += '<tr><td><span class="dot" style="background:' + lv.c + '"></span>' + lv.k + (reached ? " ✓" : "") + '</td><td>' + fmt(lv.v) +
           '</td><td class="mut">' + (d === null ? "" : (d >= 0 ? "+" : "") + d.toFixed(2) + "% от цены") + "</td></tr>";
    }
    $("levels").innerHTML = h;
  }
  draw();
}

/* ---------- ma'lumot olish ---------- */
function loadSignal() {
  return api("/api/signal?s=" + encodeURIComponent(SYMBOL) + "&t=" + SENT).then(function (j) {
    S.sig = j; if (!S.interval) S.interval = j.tf === "pump" ? "1" : j.interval; markTf();
  });
}
function loadCandles() {
  var p1 = api("/api/klines?symbol=" + encodeURIComponent(SYMBOL) + "&interval=1&limit=200").then(function (j) { S.c1 = j.candles; });
  var p2 = (S.interval && S.interval !== "1")
    ? api("/api/klines?symbol=" + encodeURIComponent(SYMBOL) + "&interval=" + S.interval + "&limit=200").then(function (j) { S.cv = j.candles; })
    : Promise.resolve().then(function () { S.cv = []; });
  return Promise.all([p1, p2]);
}
var tick = 0;
function poll() {
  if (document.hidden) return;
  var jobs = [loadCandles()];
  if (!S.sig || tick % 3 === 0 || (S.sig && S.sig.status === "open")) jobs.push(loadSignal());
  tick++;
  Promise.all(jobs).then(function () {
    showErr(""); S.lastOk = Date.now(); render();
    $("upd").textContent = "обновлено " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }).catch(function (e) { showErr(e.message || String(e)); render(); });
}
function markTf() {
  var b = document.querySelectorAll("#tfs .btn[data-iv]");
  for (var i = 0; i < b.length; i++) b[i].classList.toggle("on", b[i].getAttribute("data-iv") === S.interval);
  $("allbtn").classList.toggle("on", S.all);
}
document.querySelectorAll("#tfs .btn[data-iv]").forEach(function (b) {
  b.addEventListener("click", function () { S.interval = b.getAttribute("data-iv"); S.cv = []; markTf(); poll(); if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); });
});
$("allbtn").addEventListener("click", function () { S.all = !S.all; markTf(); draw(); });
/* chartni bosib/surib candle sonini o'zgartirish: ikki barmoq emas, oddiy — vertikal surish */
(function () {
  var y0 = null, c0 = 90, cv = $("cv");
  cv.addEventListener("touchstart", function (e) { if (e.touches.length === 1) { y0 = e.touches[0].clientY; c0 = S.count; } }, { passive: true });
  cv.addEventListener("touchmove", function (e) {
    if (y0 === null || e.touches.length !== 1) return;
    var dy = e.touches[0].clientY - y0; S.count = Math.max(30, Math.min(200, Math.round(c0 + dy / 3))); draw();
  }, { passive: true });
  cv.addEventListener("touchend", function () { y0 = null; }, { passive: true });
})();
window.addEventListener("resize", draw);
document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });

if (!SYMBOL || !SENT) { showErr("Неверная ссылка. Откройте график кнопкой под сигналом в боте."); }
else { markTf(); poll(); setInterval(poll, 3000); }
</script>
</body>
</html>
